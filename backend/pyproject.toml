[project]
name = "smartbrew-backend"
version = "0.1.0"
description = "SmartBrew POS — FastAPI backend (POS + AI + Dashboard)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }

dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",          # OAuth2PasswordRequestForm needs this
    # Data / DB
    "sqlmodel>=0.0.22",
    "alembic>=1.13.0",
    # Settings
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    # Security
    "pyjwt[crypto]>=2.9",                # JWT encode/decode (actively maintained)
    "argon2-cffi>=23.1",                 # Argon2id password hashing (OWASP recommended)
    "slowapi>=0.1.9",                    # rate limit for /auth/login
    # HTTP client (for Ollama + outbound calls)
    "httpx>=0.27",
    # tz database (required on Windows; zoneinfo has no system fallback there)
    "tzdata>=2024.2 ; sys_platform == 'win32'",
]

[dependency-groups]
dev = [
    "ruff>=0.7",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
]

# ─────────────────────────────────────────────────────────────────────
# Ruff — lint + format (replaces flake8/black/isort)
# ─────────────────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["alembic/versions"]    # auto-generated migrations

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle / pyflakes
    "I",             # isort
    "B",             # bugbear
    "UP",            # pyupgrade
    "N",             # pep8-naming
    "SIM",           # simplifications
    "PT",            # pytest style
    "RUF",           # ruff-specific
    "S",             # bandit security
    "TID",           # tidy imports
]
ignore = [
    "E501",          # line length handled by formatter
    "S101",          # assert allowed in tests
    "B008",          # FastAPI Depends() in defaults is idiomatic
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S105", "S106"]       # hardcoded passwords ok in tests
"alembic/env.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ─────────────────────────────────────────────────────────────────────
# mypy — strict typing
# ─────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/versions/", "models_store/"]

[[tool.mypy.overrides]]
module = ["slowapi.*", "argon2.*", "mlxtend.*", "prophet.*", "lightgbm.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ─────────────────────────────────────────────────────────────────────
# pytest
# ─────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers --strict-config"
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:passlib.*",
]

# ─────────────────────────────────────────────────────────────────────
# Coverage
# ─────────────────────────────────────────────────────────────────────
[tool.coverage.run]
branch = true
source = ["app"]
omit = ["alembic/*", "app/main.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
show_missing = true
skip_covered = true
